<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="NH">
  <!-- Letterforms are drawn as geometry, not <text>, so the mark renders
       identically regardless of which fonts the OS has. Inverts with the OS
       theme to match the site's ink/paper tokens. -->
  <style>
    .plate { fill: #000; }
    .mark  { fill: #fff; }
    @media (prefers-color-scheme: dark) {
      .plate { fill: #fff; }
      .mark  { fill: #000; }
    }
  </style>
  <!-- fill= is a presentation-attribute fallback for renderers that drop
       the <style> block; the CSS above overrides it. -->
  <rect class="plate" width="64" height="64" fill="#000"/>
  <g class="mark" transform="translate(9 14)" fill="#fff">
    <!-- N -->
    <polygon points="0,36 0,0 6,0 17,30 17,0 23,0 23,36 17,36 6,6 6,36"/>
    <!-- H -->
    <rect x="29" y="0" width="6" height="36"/>
    <rect x="40" y="0" width="6" height="36"/>
    <rect x="29" y="15" width="17" height="6"/>
  </g>
</svg>
