<!DOCTYPE html>
<!--
  Source for the 1200x630 social card (og.png).

  Regenerate after changing fonts or copy:
    chromium --headless=new --no-sandbox --hide-scrollbars \
      --window-size=1200,630 --virtual-time-budget=10000 \
      --screenshot=og.png file://$PWD/card.html

  Design follows STYLE.md: black/white only, Instrument Serif display at
  400 weight, DM Sans body, IBM Plex Mono labels, zero radius, no shadows.
  The card is deliberately light-independent — feeds render it on either
  background, and black holds up better in dark UIs.
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: #000; color: #fff;
    font-family: 'DM Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 64px 80px;
    position: relative;
  }

  /* Oversized monogram bleeding off the right edge. Vertically centred with a
     negative right offset so it reads as one deliberate shape rather than the
     accidental corner clip it was on the first pass. */
  .ghost {
    position: absolute; right: -74px; top: 50%; transform: translateY(-54%);
    font-family: 'Instrument Serif', serif; font-size: 540px; line-height: 0.78;
    color: #fff; opacity: 0.06; pointer-events: none;
  }

  .label {
    font-family: 'IBM Plex Mono', monospace; font-size: 19px; font-weight: 500;
    letter-spacing: 0.2em; text-transform: uppercase; color: #fff; opacity: 0.6;
    position: relative;
  }

  h1 {
    font-family: 'Instrument Serif', serif; font-weight: 400;
    font-size: 116px; line-height: 0.94; letter-spacing: -0.02em; margin: 0;
    position: relative;
  }
  h1 .dim { opacity: 0.4; }

  .rule { height: 1px; background: #fff; opacity: 0.22; position: relative; }

  .foot {
    display: flex; justify-content: space-between; align-items: flex-end;
    font-family: 'IBM Plex Mono', monospace; font-size: 20px;
    letter-spacing: 0.06em; color: #fff; opacity: 0.78;
    position: relative;
  }
  .foot strong { font-weight: 500; }
</style>
</head>
<body>
  <div class="ghost" aria-hidden="true">N</div>

  <p class="label">Backend Engineer &mdash; Remote</p>

  <h1>Nommoh<br />Hayab<span class="dim">.</span></h1>

  <div class="rule"></div>

  <div class="foot">
    <span><strong>APIs</strong> &middot; Data Pipelines &middot; Infrastructure</span>
    <span>github.com/naet001</span>
  </div>
</body>
</html>
