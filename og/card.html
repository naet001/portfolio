<!DOCTYPE html>
<!--
  Source for the 1200x630 social card (og.png).

  Regenerate after changing fonts or copy:
    chromium --headless=new --no-sandbox --hide-scrollbars \
      --window-size=1200,630 --virtual-time-budget=10000 \
      --screenshot=og.png file://$PWD/card.html

  Design follows css/tokens.css: graphite ground, Familjen Grotesk display at
  weight 600, IBM Plex Sans body, JetBrains Mono labels, no radius, no shadows.
  The card is deliberately light-independent — feeds render it on either
  background, and dark holds up better in light UIs.
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: oklch(21% 0.024 262); color: oklch(93% 0.01 250);
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 64px 80px;
    position: relative;
  }

  /* Oversized monogram bleeding off the right edge. Vertically centred with a
     negative right offset so it reads as one deliberate shape rather than the
     accidental corner clip it was on the first pass. */
  .ghost {
    position: absolute; right: -74px; top: 50%; transform: translateY(-54%);
    font-family: 'Familjen Grotesk', system-ui, sans-serif; font-weight: 600;
    font-size: 540px; line-height: 0.78;
    color: currentColor; opacity: 0.06; pointer-events: none;
  }

  .label {
    font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 19px; font-weight: 500;
    letter-spacing: 0.2em; text-transform: uppercase; color: currentColor; opacity: 0.6;
    position: relative;
  }

  h1 {
    font-family: 'Familjen Grotesk', system-ui, sans-serif; font-weight: 600;
    font-size: 116px; line-height: 0.94; letter-spacing: -0.028em; margin: 0;
    position: relative;
  }
  h1 .dim { opacity: 0.4; }

  .rule { height: 1px; background: currentColor; opacity: 0.22; position: relative; }

  .foot {
    display: flex; justify-content: space-between; align-items: flex-end;
    font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 20px;
    letter-spacing: 0.06em; color: currentColor; opacity: 0.78;
    position: relative;
  }
  .foot strong { font-weight: 500; }
</style>
</head>
<body>
  <div class="ghost" aria-hidden="true">N</div>

  <p class="label">AI Engineer &mdash; Remote</p>

  <h1>Nommoh<br />Hayab<span class="dim">.</span></h1>

  <div class="rule"></div>

  <div class="foot">
    <span><strong>rem</strong> &middot; Rust &middot; LLM agents</span>
    <span>github.com/naet001</span>
  </div>
</body>
</html>
